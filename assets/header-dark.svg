<svg xmlns="http://www.w3.org/2000/svg" width="900" height="150" viewBox="0 0 900 150" role="img" aria-labelledby="title desc">
  <title id="title">Davi Santiago — Backend &amp; AI Engineer</title>
  <desc id="desc">Compact terminal-inspired GitHub profile header for Davi Santiago.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0D1117"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#BC8CFF"/>
    </linearGradient>
  </defs>
  <style>
    .cursor { animation: blink 1.05s steps(1,end) infinite; }
    .status { animation: pulse 2.2s ease-in-out infinite; transform-origin: 682px 106px; }
    .line { animation: slide 5s ease-in-out infinite alternate; }
    @keyframes blink { 0%,48% { opacity: 1; } 49%,100% { opacity: 0; } }
    @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    @keyframes slide { from { transform: translateX(0); } to { transform: translateX(18px); } }
    @media (prefers-reduced-motion: reduce) { .cursor,.status,.line { animation: none; } }
  </style>

  <rect x="1" y="1" width="898" height="148" rx="14" fill="url(#bg)" stroke="#30363D"/>
  <rect x="1" y="1" width="898" height="3" rx="2" fill="url(#accent)" opacity=".9"/>

  <circle cx="25" cy="24" r="4" fill="#FF7B72"/>
  <circle cx="39" cy="24" r="4" fill="#D29922"/>
  <circle cx="53" cy="24" r="4" fill="#3FB950"/>
  <text x="70" y="28" fill="#8B949E" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="11">davi@github:~$ whoami</text>

  <text x="26" y="76" fill="#F0F6FC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="700">Davi Santiago</text>
  <text x="27" y="104" fill="#C9D1D9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Backend &amp; AI Engineer · Computer Science @ CESAR School</text>
  <text x="27" y="128" fill="#8B949E" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="11">Recife, Brazil  ·  Python / FastAPI / PostgreSQL</text>

  <rect x="645" y="30" width="225" height="94" rx="10" fill="#161B22" stroke="#30363D"/>
  <text x="665" y="54" fill="#8B949E" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="10">current_focus</text>
  <text x="665" y="77" fill="#58A6FF" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="12" font-weight="600">backend + applied_ai</text>
  <text x="665" y="97" fill="#BC8CFF" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="12">agents · rag · automation</text>
  <circle class="status" cx="671" cy="113" r="3.5" fill="#3FB950"/>
  <text x="681" y="117" fill="#8B949E" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="10">building</text>
  <rect class="cursor" x="727" y="108" width="6" height="10" rx="1" fill="#C9D1D9"/>

  <rect class="line" x="560" y="136" width="115" height="1" fill="url(#accent)" opacity=".25"/>
</svg>
